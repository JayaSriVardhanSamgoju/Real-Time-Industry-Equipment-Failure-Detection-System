kafka:
  bootstrap_servers: "localhost:9092"
  sensor_topic: "sensor_stream"

model:
  model_path: "model/model.pkl"
  window_size: 10
  contamination_rate: 0.05
  anomaly_threshold: -0.3
  features: ["temperature", "vibration", "humidity"]

api:
  host: "0.0.0.0"
  port: 8000

dashboard:
  refresh_rate_sec: 2

alerting:
  log_file: "storage/anomaly_logs.json"
  levels:
    low_threshold: -0.2
    medium_threshold: -0.4
    high_threshold: -0.6

monitoring:
  drift_check_interval: 100
  reference_sample_size: 500

simulation:
  anomaly_probability: 0.05
  degradation_enabled: true
  noise_factor: 0.02
  send_interval_sec: 1